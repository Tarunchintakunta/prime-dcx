    <!--
      Structured data. Deliberately limited to facts the site actually states:
      no ratings, no awards, no regulator, no user counts, no pricing.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://prime-dcx.vercel.app/#organization",
            "name": "Prime DCX",
            "url": "https://prime-dcx.vercel.app/",
            "logo": "https://prime-dcx.vercel.app/og-image.jpg",
            "description": "Prime DCX provides trading tools and market access across forex, crypto, indices, commodities, metals and share CFDs."
          },
          {
            "@type": "WebSite",
            "@id": "https://prime-dcx.vercel.app/#website",
            "url": "https://prime-dcx.vercel.app/",
            "name": "Prime DCX",
            "publisher": { "@id": "https://prime-dcx.vercel.app/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebPage",
            "@id": "https://prime-dcx.vercel.app/#webpage",
            "url": "https://prime-dcx.vercel.app/",
            "name": "Prime DCX | The Market Engine",
            "isPartOf": { "@id": "https://prime-dcx.vercel.app/#website" },
            "about": { "@id": "https://prime-dcx.vercel.app/#organization" },
            "description": "A multi-asset trading access platform: institutional terminal, risk controls, account security, funding rails and mobile execution.",
            "primaryImageOfPage": "https://prime-dcx.vercel.app/og-image.jpg"
          },
          {
            "@type": "FAQPage",
            "@id": "https://prime-dcx.vercel.app/#faq",
            "isPartOf": { "@id": "https://prime-dcx.vercel.app/#website" },
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What markets can I trade with Prime DCX?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Forex, crypto, indices, commodities, metals and share CFDs. The instruments actually available to you depend on your region and account type, and are confirmed at account opening."
                }
              },
              {
                "@type": "Question",
                "name": "What risk controls does the terminal provide?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Stop loss and take profit can be attached at order entry, margin level and free margin are displayed continuously, and exposure caps can be set per instrument and at account level."
                }
              },
              {
                "@type": "Question",
                "name": "How do deposits and withdrawals work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Supported methods include bank wire, credit and debit card, UPI, net banking, crypto, USDT, Skrill, Neteller, local payment methods and manual broker transfer. Processing times, fees, currencies and regional availability are confirmed in your account, and availability depends on your region and verification status."
                }
              },
              {
                "@type": "Question",
                "name": "How is my account secured?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Two-factor authentication on login and withdrawal, encryption in transit and at rest, withdrawal verification with device review, and session and login history you can audit."
                }
              },
              {
                "@type": "Question",
                "name": "What are the risks of trading with Prime DCX?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Trading involves risk. Losses can exceed deposits depending on the product and leverage used. Leveraged products magnify gains and losses, margin positions can be closed automatically without prior notice, and Prime DCX does not provide investment advice. Only trade with money you can afford to lose."
                }
              }
            ]
          }
        ]
      }
    </script>
